[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearspeech-mcp-server"
version = "1.0.0"
description = "MCP server wrapping the ClearSpeech API for aphasia communication"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
clearspeech-mcp = "server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-anyio",
    "respx>=0.22.0",
]

[tool.hatch.build.targets.wheel]
include = ["server.py"]
